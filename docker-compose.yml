services:
  id3-organiser:
    image: id3-organiser
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - "${SOURCE_PATH}:/input:ro"
      - "${DEST_PATH}:/destination"
      - "./data:/app/data"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command:
      - python
      - id3_organiser.py
      - --no-browser
      - --db
      - /app/data/music_organiser.db
      - --poll-watcher
